services:
  ssh-key-generator:
    image: ghcr.io/hueske-digital/sshkey-generator:latest
    environment:
      - SSH_HOST
      - SSH_HOSTNAME
      - SSH_USER
      - SSH_PORT
    volumes:
      - ssh_data:/root/.ssh

  backup:
    image: garethgeorge/backrest:latest-alpine
    hostname: docker
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - NOTIFY_URL
      - CADDY_DOMAIN=${CADDY_DOMAIN}
      - CADDY_TYPE=${CADDY_TYPE:-internal}
      - CADDY_PORT=${CADDY_PORT:-9898}
      - CADDY_ALLOWLIST=${CADDY_ALLOWLIST:-}
      - CADDY_AUTH=${CADDY_AUTH:-}
      - CADDY_AUTH_URL=${CADDY_AUTH_URL:-}
    volumes:
      - app_data:/data
      - app_config:/config
      - app_cache:/cache
      - app_tmp:/tmp
      - ssh_data:/root/.ssh
      - /var/lib/docker/volumes:/mnt/volumes
      - $HOME:/mnt/home
      - /var/run/docker.sock:/var/run/docker.sock
      - $PWD/bin:/scripts:ro
    networks:
      - caddy

volumes:
  app_data:
  app_config:
  app_cache:
  app_tmp:
  ssh_data:

networks:
  caddy:
